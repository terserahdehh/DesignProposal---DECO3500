[platformio]
default_envs = nayaka, syifa

[env]
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = arduino
board_upload.flash_size = 16MB
board_build.flash_size = 16MB
board_build.partitions = partitions.csv
board_build.arduino.memory_type = qio_qspi
monitor_speed = 115200
upload_speed = 115200
lib_deps =
  bodmer/TFT_eSPI@2.5.43
  bblanchon/ArduinoJson@6.21.5
build_unflags = -std=gnu++11
build_flags =
  -std=gnu++17
  -DDISABLE_ALL_LIBRARY_WARNINGS
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_CDC_ON_BOOT=0
  -DUSER_SETUP_LOADED
  -DGC9A01_DRIVER
  ; TFT_eSPI 2.5.43 otherwise uses FSPI=0 as a raw register index on S3.
  -DUSE_FSPI_PORT
  -DTFT_WIDTH=240
  -DTFT_HEIGHT=240
  -DTFT_MISO=12
  -DTFT_MOSI=11
  -DTFT_SCLK=10
  -DTFT_CS=9
  -DTFT_DC=8
  -DTFT_RST=14
  -DTFT_BL=2
  -DTFT_BACKLIGHT_ON=1
  -DLOAD_GLCD
  -DLOAD_FONT2
  -DLOAD_FONT4
  -DSPI_FREQUENCY=40000000

[env:nayaka]
build_flags = ${env.build_flags} -DPULSE_OWNER=0
upload_port = /dev/cu.usbmodem5B910337701

[env:syifa]
build_flags = ${env.build_flags} -DPULSE_OWNER=1
upload_port = /dev/cu.usbmodem5B910342271
